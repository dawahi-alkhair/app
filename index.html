<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة ضواحي الخير</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            text-align: center; 
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* الجزء العلوي */
        .header-section {
            width: 100%;
            min-height: 350px;
            background: linear-gradient(rgba(0, 0, 0, 0.0), rgba(0, 0, 0, 0.150)), url('header_bg.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            padding: 20px;
        }

        .logo {
            width: 350px;
            height: 350px;
            background-image: url('logo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.0));
        }

        .header-section h1 { 
            margin: -30px auto 30px auto; 
            font-size: 26px; 
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }

        /* حاوية القوائم الأساسية - تتوسط الصفحة بالكامل */
        .main-wrapper {
            width: 100%;
            max-width: 550px;
            margin: -30px auto 30px auto;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 10;
        }

        .menu-column {
            width: 100%;
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .menu-title { 
            width: 100%;
            color: #2c3e50; 
            margin-bottom: 20px; 
            font-size: 18px; 
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        /* زر تقرير الفحص الأزرق ومتناسق كلياً */
        .btn-tq { 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 400px; /* العرض الأقصى للزر على اللابتوب */
            padding: 14px 20px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2980b9, #213c69);
            box-shadow: 0 4px 12px rgba(33, 60, 105, 0.25);
            transition: all 0.3s ease;
            gap: 10px;
            border: none;
            cursor: pointer;
        }

        .btn-tq:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 18px rgba(33, 60, 105, 0.35);
            filter: brightness(1.08);
        }

        .status-bar {
            width: 100%;
            font-size: 14px;
            color: #555;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            line-height: 1.6;
        }

        /* تحسينات للشاشات الصغيرة جداً (الهواتف) */
        @media (max-width: 480px) {
            .header-section {
                min-height: 240px;
            }
            .logo {
                width: 120px;
                height: 120px;
            }
            .menu-column {
                padding: 20px 15px;
            }
            .btn-tq {
                font-size: 15px;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="logo"></div>
        <h1>شركة ضواحي الخير</h1>
        <h1>نظام التقارير</h1>
    </div>

    <div class="main-wrapper">
        <div class="menu-column">
            <h2 class="menu-title">القائمة الرئيسية</h2>
            <a href="tq/1/index.html" class="btn-tq" onclick="saveVisit('تقرير الفحص')">
                📋 تقرير الفحص
            </a>
        </div>

        <div id="status" class="status-bar">مرحباً بك في شركة ضواحي الخير</div>
    </div>

    <script>
        // حفظ آخر عملية تمت في المتصفح
        function saveVisit(actionName) {
            localStorage.setItem('last_action', actionName);
            const now = new Date();
            const timeString = now.toLocaleDateString('ar-SA') + " | " + now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            localStorage.setItem('last_action_time', timeString);
        }

        // تحديث شريط الحالة عند التحميل
        window.onload = function() {
            const lastAction = localStorage.getItem('last_action');
            const lastTime = localStorage.getItem('last_action_time');
            if (lastAction && lastTime) {
                document.getElementById('status').innerHTML = 
                    "📂 <b>آخر إجراء:</b> " + lastAction + " <br><small style='color: #888;'>" + lastTime + "</small>";
            }
        }
    </script>

</body>
</html>
