<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> شركة ضواحي الخير</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            text-align: center; 
        }

        /* الجزء العلوي */
        .header-section {
            width: 100%;
            height: 350px; /* زيادة الارتفاع لاستيعاب الشعار */
            background-image: linear-gradient(rgba(0,0,0,0.0), rgba(0,0,0,0.150)), url('header_bg.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 4px 5px rgba(0,0,0,0.3);
        }

        .logo {
            width: 350px;
            height: 350px;
            background-image: url('logo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0 auto 10px auto;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.0));
        }

        .header-section h1 { 
            margin: -30px auto 30px auto; 
            font-size: 26px; 
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }

        /* حاوية القوائم الأساسية */
        .main-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
            margin: -30px auto 30px auto;
        }

        .menu-column {
            flex: 1;
            min-width: 320px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 { 
            color: #2c3e50; 
            margin-bottom: 20px; 
            font-size: 18px; 
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start; /* محاذاة العناصر من البداية */
            padding: 12px 15px;
width: 350px;
            margin: 10px  auto;
            font-size: 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
            gap: 10px; /* مسافة بين الرقم والاسم */
        }

        /* ألوان قائمة تقرير الفحص (اليمين) */
        .btn-ksh { background: linear-gradient(135deg, #d3755e, #bc401e); }
        
        /* ألوان قائمة تقرير الفحص (اليسار) */
        .btn-tq { 
            background: linear-gradient(135deg, #2980b9, #213c69); 
            justify-content: center; /* جعل المحتوى في المنتصف تماماً */
        }
        
        /* لون زر تقرير الفحص جديد */
        .btn-100 { 
            background: linear-gradient(135deg, #a19d9a, #a19d9a); 
            justify-content: center; /* تظبيط المحاذاة للأزرار الجديدة */
        }

        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            filter: brightness(1.1);
        }

        .status-bar {
            width: 100%;
            max-width: 660px;
            margin: 20px auto;
            font-size: 13px;
            color: #7f8c8d;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="logo"></div>
        <h1>شركة ضواحي الخير</h1>
        <h1>نظام التقارير</h1>
    </div>

    <div class="main-wrapper">
        
        <div class="menu-column">
            <h2> </h2>
            <a href="tq/1/index.html" class="btn btn-tq" onclick="saveVisit(' تقرير الفحص')">
                <span class="num-badge"></span> 📋 تقرير الفحص
            </a>

        </div>

       
        <div id="status" class="status-bar">مرحباً بك في شركة ضواحي الخير</div>
    </div>

    <script>
        // حفظ آخر عملية تمت في المتصفح
        function saveVisit(actionName) {
            localStorage.setItem('last_action', actionName);
            const now = new Date();
            const timeString = now.toLocaleDateString('ar-SA') + " | " + now.toLocaleTimeString('ar-SA');
            localStorage.setItem('last_action_time', timeString);
        }

        // تحديث شريط الحالة عند التحميل
        window.onload = function() {
            const lastAction = localStorage.getItem('last_action');
            const lastTime = localStorage.getItem('last_action_time');
            if (lastAction) {
                document.getElementById('status').innerHTML = 
                    "📂 <b>آخر إجراء:</b> " + lastAction + " <br> <small>" + lastTime + "</small>";
            }
        }
    </script>

</body>
</html>
