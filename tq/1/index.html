<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=794, initial-scale=1.0"> 
    <title>كشف الركاب</title>
    <!-- استدعاء مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* التعديلات الأساسية لضمان عدم القص */
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
        
        body { 
            background-color: #525659; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            font-family: 'Arial', sans-serif; 
        }

        .header-bg { width: 100%; height: 160px; background: #2c3e50; display: flex; align-items: center; justify-content: center; }

        .toolbar { width: 100%; background: #333; padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        
        /* تعديل الأزرار لتصبح عمودية وتحتوي على النص العربي والإنجليزي */
        .share-btn, .print-btn, .back-btn, .clear-btn, .copy-btn, .paste-btn { 
            padding: 8px 16px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            margin: 5px; 
            color: white; 
            display: inline-flex; 
            flex-direction: column; /* جعل العناصر تحت بعضها */
            align-items: center; 
            justify-content: center; 
            gap: 2px;
            vertical-align: middle;
            min-width: 110px;
        }

        /* تنسيق النص الإنجليزي تحت الكلمة */
        .btn-en {
            font-size: 10px;
            font-weight: normal;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }
        
        .share-btn { background: #25d366; } /* لون واتساب */
        .print-btn { background: #e67e22; }
        .copy-btn { background: #2980b9; }
        .paste-btn { background: #8e44ad; }
        .back-btn { background: #95a5a6; }
        .clear-btn { background: #c0392b; }
        
        /* تنسيق أيقونة الواتساب لتطابق شكل تطبيق الواتساب بالضبط */
        .whatsapp-icon-img {
            width: 22px;
            height: 22px;
            display: inline-block;
            margin-bottom: 2px;
        }

        /* هذا الجزء مهم جداً لسفاري: جعل الحاوية مطابقة تماماً لمقاس A4 */
        #pdf-content { 
            width: 210mm; 
            display: block; 
            background: white; 
            padding: 0;
            margin: 0;
        }

        .page { 
            width: 210mm; 
            height: 296.5mm; /* تقليل بسيط جداً لتجنب تداخل الصفحات في سفاري */
            background-size: 100% 100%; 
            background-repeat: no-repeat; 
            position: relative; 
            background-color: white; 
            overflow: hidden; 
            display: block; 
            page-break-after: always;
            box-shadow: none;
        }

        #page1 { background-image: url('0001.jpg'); }
        #page2 { background-image: url('0002.jpg'); }

        input { position: absolute; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(0,0,0,0.1); font-size: 15px; text-align: center; outline: none; color: black; }
        .exporting input { border: none !important; background: transparent !important; }

        /* تموضع الخانات الرئيسية في الصفحة الأولى */
        .inp-date-top { top: 100px; left: 55px; width: 130px; }
        .driver-name { top: 232px; left: 400px; width: 190px; }
        .from-loc { top: 232px; left: 195px; width: 102px; }
        .to-loc { top: 282px; left: 440px; width: 151px; }
        .box-driver { top: 945px; left: 400px; width: 190px; }
        /* تموضع المربعات النصية الثلاثة الجديدة في الصفحة الثانية (يمكنك تعديل الأماكن top و left حسب تصميم صورتك الثانية) */
        .box-date { top: 100px; left: 55px; width: 130px; }
        .box-from { top: 210px; left: 130px; width: 102px; }
        .box-to   { top: 210px; left: 460px; width: 151px; }

        @media print { 
            .header-bg, .toolbar { display: none !important; }
            @page { size: A4; margin: 0 !important; } 
            .page { margin: 0 !important; border: none !important; } 
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="shareBtn" class="share-btn">
            <!-- أيقونة تطبيق الواتساب الرسمية -->
            <svg class="whatsapp-icon-img" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="16" fill="#25D366"/>
                <path fill="#FFFFFF" d="M16 6a9.93 9.93 0 0 0-8.52 15.06L6 26l5.09-1.33A9.93 9.93 0 1 0 16 6zm0 18.15a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.1.81.83-3-.2-.31a8.21 8.21 0 1 1 6.95 3.82zm4.51-6.17c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.65.81-.8 0.98-.15.17-.3.19-.55.07-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.44.12-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.55-.42h-.47c-.17 0-.44.06-.67.31s-.88.86-.88 2.1.9 2.44 1.03 2.61c.12.17 1.77 2.71 4.29 3.8 0.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.18-.47-.3z"/>
            </svg>
            <span>واتساب PDF</span>
            <span class="btn-en">WhatsApp PDF</span>
        </button>
        <button id="printBtn" class="print-btn">
            <span><i class="fa-solid fa-print"></i> طباعة كمبيوتر</span>
            <span class="btn-en">Print</span>
        </button>
        <button class="clear-btn" onclick="clearData()">
            <span><i class="fa-solid fa-trash"></i> مسح البيانات</span>
            <span class="btn-en">Clear Data</span>
        </button>
        <button class="back-btn" onclick="window.history.back()">
            <span><i class="fa-solid fa-arrow-right"></i> رجوع</span>
            <span class="btn-en">Back</span>
        </button>
    </div>

    <div id="pdf-content">
        <!-- الصفحة الأولى -->
        <div class="page" id="page1">
            <input type="text" id="todayDate" class="inp-date-top" data-save="d1">
            <input type="text" class="from-loc" data-save="d6">
            <input type="text" class="to-loc" data-save="d7">
            <input type="text" class="driver-name" data-save="d8">
            <input type="text" id="autodriverBox" class="box-driver" readonly>

        </div>

        <!-- الصفحة الثانية (تحتوي الآن على المربعات التلقائية) -->
        <div class="page" id="page2">
            <input type="text" id="autoDateBox" class="box-date" readonly>
            <input type="text" id="autoFromBox" class="box-from" readonly>
            <input type="text" id="autoToBox" class="box-to" readonly>
        </div>
    </div>

    <script>
        const path = window.location.pathname;
        let pageID = path.includes('/1/') ? "D1_" : (path.includes('/2/') ? "D2_" : "D3_");
        
        const allInputs = document.querySelectorAll('input[data-save]');
        
        const todayDateInput = document.getElementById('todayDate');
        const fromLocInput = document.querySelector('.from-loc');
        const toLocInput = document.querySelector('.to-loc');
        const drivernameInput = document.querySelector('.driver-name');

        const autoDateBox = document.getElementById('autoDateBox');
        const autoFromBox = document.getElementById('autoFromBox');
        const autoToBox = document.getElementById('autoToBox');
        const autodriverBox = document.getElementById('autodriverBox');

        // دالة تحديث القيم تلقائياً في مربعات الصفحة الثانية
        function updateAutoBoxes() {
            autoDateBox.value = todayDateInput.value;
            autoFromBox.value = fromLocInput.value;
            autoToBox.value = toLocInput.value;
            autodriverBox.value = drivernameInput.value;

        }

        // دالة التاريخ (يوم - شهر - سنة)
        function applyTodayDate() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            
            const dateString = yyyy + '-' + mm + '-' + dd;
            
            todayDateInput.value = dateString;
            localStorage.setItem(pageID + "d1", dateString);
            updateAutoBoxes();
        }

        // حفظ وقراءة البيانات وتحديث المربعات التلقائية
        allInputs.forEach(input => {
            input.addEventListener('input', () => {
                localStorage.setItem(pageID + input.getAttribute('data-save'), input.value);
                updateAutoBoxes();
            });
        });

        window.addEventListener('load', () => {
            allInputs.forEach(input => {
                const val = localStorage.getItem(pageID + input.getAttribute('data-save'));
                if (val) input.value = val;
            });
            applyTodayDate();
            updateAutoBoxes();
        });

        function clearData() { 
            if(confirm("مسح؟")) { 
                allInputs.forEach(i => { 
                    localStorage.removeItem(pageID + i.getAttribute('data-save')); 
                    i.value = ''; 
                }); 
                applyTodayDate();
                updateAutoBoxes();
            } 
        }

        document.getElementById('shareBtn').addEventListener('click', async function() {
            const element = document.getElementById('pdf-content');
            element.classList.add('exporting');
            
            const opt = {
                margin: 0,
                filename: 'كشف_الركاب.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 2,            
                    useCORS: true, 
                    logging: false,
                    letterRendering: true,
                    allowTaint: false,
                    scrollX: 0,          
                    scrollY: 0,
                    windowWidth: 794    
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            try {
                window.scrollTo(0, 0);
                const pdfWorker = html2pdf().set(opt).from(element);
                
                if (navigator.share && navigator.canShare) {
                    const pdfBlob = await pdfWorker.output('blob');
                    const file = new File([pdfBlob], "كشف_الركاب.pdf", { type: "application/pdf" });
                    
                    await navigator.share({
                        files: [file],
                        title: 'كشف الركاب'
                    });
                } else {
                    await pdfWorker.save();
                }
            } catch (err) {
                console.error(err);
                alert("حدث خطأ، سيتم التحميل المباشر");
                html2pdf().set(opt).from(element).save();
            } finally {
                element.classList.remove('exporting');
            }
        });

        document.getElementById('printBtn').addEventListener('click', () => window.print());
    </script>
</body>
</html>
