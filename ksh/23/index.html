<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=794, initial-scale=1.0"> 
    <title>كشف الركاب</title>
    <!-- استدعاء مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* التعديلات الأساسية لضمان عدم القص */
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
        
        body { 
            background-color: #525659; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            font-family: 'Arial', sans-serif; 
        }

        .header-bg { width: 100%; height: 160px; background: #2c3e50; display: flex; align-items: center; justify-content: center; }

        .toolbar { width: 100%; background: #333; padding: 15px; position: sticky; top: 0; z-index: 1000; text-align: center; }
        
        /* تعديل الأزرار لتصبح عمودية وتحتوي على النص العربي والإنجليزي */
        .share-btn, .print-btn, .back-btn, .clear-btn, .copy-btn, .paste-btn { 
            padding: 8px 16px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            margin: 5px; 
            color: white; 
            display: inline-flex; 
            flex-direction: column; /* جعل العناصر تحت بعضها */
            align-items: center; 
            justify-content: center; 
            gap: 2px;
            vertical-align: middle;
            min-width: 110px;
        }

        /* تنسيق النص الإنجليزي تحت الكلمة */
        .btn-en {
            font-size: 10px;
            font-weight: normal;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }
        
        .share-btn { background: #25d366; } /* لون واتساب */
        .print-btn { background: #e67e22; }
        .copy-btn { background: #2980b9; }
        .paste-btn { background: #8e44ad; }
        .back-btn { background: #95a5a6; }
        .clear-btn { background: #c0392b; }
        
        /* تنسيق أيقونة الواتساب لتطابق شكل تطبيق الواتساب بالضبط */
        .whatsapp-icon-img {
            width: 22px;
            height: 22px;
            display: inline-block;
            margin-bottom: 2px;
        }

        
        /* هذا الجزء مهم جداً لسفاري: جعل الحاوية مطابقة تماماً لمقاس A4 */
        #pdf-content { 
            width: 210mm; 
            display: block; 
            background: white; 
            padding: 0;
            margin: 0;
        }

        .page { 
            width: 210mm; 
            height: 296.5mm; /* تقليل بسيط جداً لتجنب تداخل الصفحات في سفاري */
            background-size: 100% 100%; 
            background-repeat: no-repeat; 
            position: relative; 
            background-color: white; 
            overflow: hidden; 
            display: block; 
            page-break-after: always;
            box-shadow: none;
        }

        #page1 { background-image: url('0001.jpg'); }
        #page2 { background-image: url('0002.jpg'); }
        #page3 { background-image: url('0003.jpg'); }
        #page4 { background-image: url('0004.jpg'); }

        input { position: absolute; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(0,0,0,0.1); font-size: 15px; text-align: center; outline: none; color: black; }
        .exporting input { border: none !important; background: transparent !important; }

        /* تموضع الخانات (نفس إحداثياتك) */
        .inp-date-top { top: 358px; left: 55px; width: 130px; }
        .plate-num { top: 425px; left: 210px; width: 120px; }
        .driver-name { top: 425px; left: 343px; width: 190px; }
        .id-num { top: 425px; left: 542px; width: 110px; }
        .phone-num { top: 425px; left: 665px; width: 84px; }
        .from-loc { top: 455px; left: 48px; width: 235px; }
        .to-loc { top: 455px; left: 417px; width: 211px; }
        .col-name { left: 420px; width: 285px; }
        .col-nat { left: 285px; width: 120px; }
        .col-passport { left: 55px; width: 220px; }

        @media print { 
            .header-bg, .toolbar { display: none !important; }
            @page { size: A4; margin: 0 !important; } 
            .page { margin: 0 !important; border: none !important; } 
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="shareBtn" class="share-btn">

            <!-- أيقونة تطبيق الواتساب الرسمية -->
            <svg class="whatsapp-icon-img" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="16" fill="#25D366"/>
                <path fill="#FFFFFF" d="M16 6a9.93 9.93 0 0 0-8.52 15.06L6 26l5.09-1.33A9.93 9.93 0 1 0 16 6zm0 18.15a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.1.81.83-3-.2-.31a8.21 8.21 0 1 1 6.95 3.82zm4.51-6.17c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.65.81-.8 0.98-.15.17-.3.19-.55.07-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.44.12-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.55-.42h-.47c-.17 0-.44.06-.67.31s-.88.86-.88 2.1.9 2.44 1.03 2.61c.12.17 1.77 2.71 4.29 3.8 0.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.18-.47-.3z"/>
            </svg>
            <span>واتساب PDF</span>
            <span class="btn-en">WhatsApp PDF</span>
        </button>
        <button id="printBtn" class="print-btn">
            <span><i class="fa-solid fa-print"></i> طباعة كمبيوتر</span>
            <span class="btn-en">Print</span>
        </button>
        <button id="copyBtn" class="copy-btn">
            <span><i class="fa-solid fa-copy"></i> نسخ</span>
            <span class="btn-en">Copy</span>
        </button>
        <button id="pasteBtn" class="paste-btn">
            <span><i class="fa-solid fa-paste"></i> لصق</span>
            <span class="btn-en">Paste</span>
        </button>
        <button class="clear-btn" onclick="clearData()">
            <span><i class="fa-solid fa-trash"></i> مسح البيانات</span>
            <span class="btn-en">Clear Data</span>
        </button>
        <button class="back-btn" onclick="window.history.back()">
            <span><i class="fa-solid fa-arrow-right"></i> رجوع</span>
            <span class="btn-en">Back</span>
        </button>
    </div>

    <div id="pdf-content">
        <div class="page" id="page1">
                    <input type="text" id="todayDate" class="inp-date-top" data-save="d1">
            <input type="text" class="from-loc" data-save="d6">
            <input type="text" class="to-loc" data-save="d7">
            <div id="passenger-inputs"></div>
        </div>
        <div class="page" id="page2"></div>
        <div class="page" id="page3"></div>
        <div class="page" id="page4"></div>
    </div>

    <script>
        // --- إعداد الهوية وتوليد الخانات (نفس الكود السابق) ---
        const path = window.location.pathname;
        let pageID = path.includes('/21/') ? "D21_" : (path.includes('/22/') ? "D22_" : "D23_");
        
        const container = document.getElementById('passenger-inputs');
        let startTop = 550, rowHeight = 27.5, rowsHtml = '';
        for (let i = 0; i < 16; i++) {
            let top = startTop + (i * rowHeight);
            rowsHtml += `<input type="text" class="col-name" style="top: ${top}px;" data-save="n${i}">`;
            rowsHtml += `<input type="text" class="col-nat" style="top: ${top}px;" data-save="nat${i}">`;
            rowsHtml += `<input type="text" class="col-passport" style="top: ${top}px;" data-save="p${i}">`;
        }
        container.innerHTML = rowsHtml;

        const allInputs = document.querySelectorAll('input[data-save]');

 // دالة التاريخ: قمت بتغيير الترتيب هنا ليصبح (يوم - شهر - سنة)
        function applyTodayDate() {
            const dateInput = document.getElementById('todayDate');
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            
            // الترتيب: يوم-شهر-سنة
            const dateString = yyyy + '-' + mm + '-' + dd;
            
            dateInput.value = dateString;
            localStorage.setItem(pageID + "d1", dateString);
        }

        // حفظ البيانات

        allInputs.forEach(input => {
            input.addEventListener('input', () => localStorage.setItem(pageID + input.getAttribute('data-save'), input.value));
        });
        window.addEventListener('load', () => {
            allInputs.forEach(input => {
                const val = localStorage.getItem(pageID + input.getAttribute('data-save'));
                if (val) input.value = val;
            });
            // وضع التاريخ الحالي دائماً
            applyTodayDate();
        });

        function clearData() { if(confirm("مسح؟")) { allInputs.forEach(i => { localStorage.removeItem(pageID+i.getAttribute('data-save')); i.value=''; }); } }
        // --- ميزة نسخ بيانات الركاب ---
        document.getElementById('copyBtn').addEventListener('click', function() {
            let passengersData = [];
            for (let i = 0; i < 16; i++) {
                let name = document.querySelector(`input[data-save="n${i}"]`).value;
                let nat = document.querySelector(`input[data-save="nat${i}"]`).value;
                let passport = document.querySelector(`input[data-save="p${i}"]`).value;
                
                if (name.trim() !== "" || nat.trim() !== "" || passport.trim() !== "") {
                    passengersData.push({ name, nat, passport });
                }
            }

            if (passengersData.length === 0) {
                alert("لا توجد بيانات ركاب لنسخها!");
                return;
            }

            localStorage.setItem("copied_passengers", JSON.stringify(passengersData));
            alert(`تم نسخ بيانات ${passengersData.length} راكب بنجاح!`);
        });

        // --- ميزة لصق بيانات الركاب ---
        document.getElementById('pasteBtn').addEventListener('click', function() {
            let savedData = localStorage.getItem("copied_passengers");
            if (!savedData) {
                alert("لا توجد بيانات مسجلة في الذاكرة للِصقها. قم بالنسخ أولاً!");
                return;
            }

            let passengersData = JSON.parse(savedData);
            
            // تفريغ خانات الركاب الحالية أولاً وحذفها من التخزين المحلي
            for (let i = 0; i < 16; i++) {
                let nameInput = document.querySelector(`input[data-save="n${i}"]`);
                let natInput = document.querySelector(`input[data-save="nat${i}"]`);
                let passportInput = document.querySelector(`input[data-save="p${i}"]`);
                
                nameInput.value = "";
                natInput.value = "";
                passportInput.value = "";
                
                localStorage.removeItem(pageID + `n${i}`);
                localStorage.removeItem(pageID + `nat${i}`);
                localStorage.removeItem(pageID + `p${i}`);
            }

            // لصق البيانات الجديدة بالترتيب وتخزينها
            passengersData.forEach((passenger, i) => {
                if (i < 16) {
                    let nameInput = document.querySelector(`input[data-save="n${i}"]`);
                    let natInput = document.querySelector(`input[data-save="nat${i}"]`);
                    let passportInput = document.querySelector(`input[data-save="p${i}"]`);

                    nameInput.value = passenger.name;
                    natInput.value = passenger.nat;
                    passportInput.value = passenger.passport;

                    localStorage.setItem(pageID + `n${i}`, passenger.name);
                    localStorage.setItem(pageID + `nat${i}`, passenger.nat);
                    localStorage.setItem(pageID + `p${i}`, passenger.passport);
                }
            });

            alert("تم لصق بيانات الركاب بنجاح!");
        });



        // --- التعديل الجذري لحل مشكلة القص في سفاري وآيفون ---
        document.getElementById('shareBtn').addEventListener('click', async function() {
            const element = document.getElementById('pdf-content');
            
            // 1. إضافة كلاس التصدير
            element.classList.add('exporting');
            
            // 2. إعدادات خاصة جداً لسفاري
            const opt = {
                margin: 0,
                filename: 'كشف_الركاب.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 2,           // تحسين الدقة
                    useCORS: true, 
                    logging: false,
                    letterRendering: true,
                    allowTaint: false,
                    scrollX: 0,         // منع الإزاحة الجانبية
                    scrollY: 0,
                    windowWidth: 794    // تثبيت عرض النافذة أثناء الالتقاط لسفاري
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            try {
                // إجبار المتصفح على العودة لأعلى الصفحة قبل البدء (مهم لسفاري)
                window.scrollTo(0, 0);
                
                const pdfWorker = html2pdf().set(opt).from(element);
                
                if (navigator.share && navigator.canShare) {
                    const pdfBlob = await pdfWorker.output('blob');
                    const file = new File([pdfBlob], "كشف_الركاب.pdf", { type: "application/pdf" });
                    
                    await navigator.share({
                        files: [file],
                        title: 'كشف الركاب'
                    });
                } else {
                    await pdfWorker.save();
                }
            } catch (err) {
                console.error(err);
                alert("حدث خطأ، سيتم التحميل المباشر");
                html2pdf().set(opt).from(element).save();
            } finally {
                element.classList.remove('exporting');
            }
        });

        document.getElementById('printBtn').addEventListener('click', () => window.print());
    </script>
</body>
</html>
